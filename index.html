<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GymTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login">
    <section class="login-photo">
      <h1>GymTrack</h1>
      <p>Log every set, see your personal bests, and get a plan for the week.</p>
      <p class="credit">Photo: "Free barbell weight plate image", CC0, via rawpixel</p>
    </section>

    <section class="login-side">
      <div class="login-box">
        <p id="notice" class="notice" hidden></p>

        <h2 id="form-title">Log in</h2>
        <p id="form-intro" class="intro">Welcome back. Your workouts are waiting.</p>

        <form id="login-form">
          <label>Email
            <input type="email" id="email" autocomplete="email" required>
          </label>
          <label>Password
            <input type="password" id="password" autocomplete="current-password" minlength="6" required>
          </label>
          <p id="error" class="error" hidden></p>
          <button type="submit" id="submit-button" class="wide">Log in</button>
        </form>

        <p class="switch">
          <span id="switch-text">No account yet?</span>
          <button type="button" id="switch-button" class="text-button">Register</button>
        </p>
      </div>
    </section>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
